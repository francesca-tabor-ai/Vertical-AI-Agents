# Example customer configuration
# Copy this file and rename for each customer

customer_id: example-customer
customer_name: Example Corp

# Model settings
model: sonnet
max_tokens: 4096
temperature: 0.7

# Enabled prompts/workflows
prompts:
  - classification
  - extraction
  - summarization

# Rate limits
rate_limit:
  requests_per_minute: 60
  tokens_per_minute: 100000

# Cost tracking
budget:
  monthly_limit_usd: 500
  alert_threshold_percent: 80
